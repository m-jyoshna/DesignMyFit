<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #f848f5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .gradient-button {
            background: linear-gradient(135deg, #667eea 0%, #e54df3 100%);
            color: white;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 class="text-2xl font-bold text-black-700">SIGN UP NOW!</h1>
        <form>
            <div class="flex space-x-4 mb-4">
                <input type="text" placeholder="Firstname" class="w-1/2 p-2 border-b-2 border-gray-300 focus:outline-none focus:border-blue-500">
                <input type="text" placeholder="Lastname" class="w-1/2 p-2 border-b-2 border-gray-300 focus:outline-none focus:border-blue-500">
            </div>
            <div class="relative mb-4">
                <input type="email" placeholder="name123@gmail.com" class="w-full p-2 border-b-2 border-gray-300 focus:outline-none focus:border-blue-500">
                <i class="fas fa-check absolute right-2 top-2 text-blue-500"></i>
            </div>
            <div class="relative mb-4">
                <input type="password" placeholder="Password" class="w-full p-2 border-b-2 border-gray-300 focus:outline-none focus:border-blue-500">
                <i class="fas fa-eye absolute right-2 top-2 text-gray-500"></i>
            </div>
            <div class="mb-4">
                <input type="password" placeholder="Confirm Password" class="w-full p-2 border-b-2 border-gray-300 focus:outline-none focus:border-blue-500">
            </div>
            <p class="text-gray-600 text-sm mb-4">By signing up, you agree to <a href="#" class="text-blue-500">our Terms.</a></p>
            <button type="submit" class="w-full py-2 rounded gradient-button">DONE</button>
        </form>
    </div>
</body>
</html>
