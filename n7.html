<html>
 <head>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
 </head>
 <body class="bg-white">
  <!-- Header -->
  <div class="flex items-center justify-between p-4 bg-gray-100">
   <div class="flex items-center space-x-4">
    <i class="fas fa-search text-gray-500">
    </i>

   </div>
   <div class="flex items-center space-x-4">
    <a class="text-gray-700" href="#">
     Login
    </a>
    <i class="fas fa-user text-gray-700">
    </i>
    <i class="fas fa-heart text-gray-700">
    </i>
    <i class="fas fa-shopping-cart text-gray-700">
    </i>
   </div>
  </div>

  <div class="flex justify-center space-x-8 p-4 bg-white border-b border-gray-200">

    STYLE HUB

    <h2 class="mt-4 text-gray-800 font-semibold">
     Embroidered silk lehanga
    </h2>
    <div class="flex items-center space-x-2 mt-2">
     <span class="text-gray-800 font-semibold">
      ₹1499
     </span>

      ₹2999
     </span>
     <span class="text-red-600">
      50% OFF
     </span>

   </div>
   <!-- Product 2 -->

    <img alt="Floral V-Neck Cotton Womens Knee Length Dress" class="w-300 h-400 rounded-md" height="400" src="https://i.pinimg.com/736x/30/b2/b4/30b2b4e0ed569d5952d55daf875d7d36.jpg" width="300"/>

    </h2>

     </span>

   </div>
   <!-- Product 3 -->
   <div class="bg-white border border-gray-200 rounded-lg p-4">
    <img alt="Floral Viscose Round Neck Womens Top" class="w-full h-auto rounded-md" height="400" src="https://i.pinimg.com/736x/d1/4f/89/d14f89f1c1997b73f848731b99a90faf.jpg" width="300"/>
    <h2 class="mt-4 text-gray-800 font-semibold">
     Long Frock
    </h2>
    <div class="flex items-center space-x-2 mt-2">

      ₹999

      ₹1999
     </span>

    <h2 class="mt-4 text-gray-800 font-semibold">
    Mermaid Frill frock
    </h2>
    <div class="flex items-center space-x-2 mt-2">
     <span class="text-gray-800 font-semibold">
      ₹2890
     </span>
    </div>
   </div>
  </div>

</html>
