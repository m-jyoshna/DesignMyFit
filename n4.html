<html>
 <head>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
 </head>
 <body class="bg-white">
  <!-- Header -->
  <div class="flex items-center justify-between p-4 bg-gray-100">
   <div class="flex items-center space-x-4">
    <i class="fas fa-search text-gray-500">
    </i>
    <input class="w-full p-2 text-gray-700 bg-white border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="What are you looking for?" type="text"/>
   </div>
   <div class="flex items-center space-x-4">
    <a class="text-gray-700" href="#">
     Login
    </a>
    <i class="fas fa-user text-gray-700">
    </i>
    <i class="fas fa-heart text-gray-700">
    </i>
    <i class="fas fa-shopping-cart text-gray-700">
    </i>
   </div>
  </div>
  <!-- Navigation -->
  <div class="flex justify-center space-x-8 p-4 bg-white border-b border-gray-200">
   <a class="text-gray-700" href="#">
    WOMEN
   </a>
   <a class="text-gray-700" href="#">
    KIDS
   </a>
   <a class="text-gray-700" href="#">
    BRANDS
   </a>
   <a class="text-gray-700" href="#">
    STYLE HUB
   </a>
  </div>
  <!-- Product Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 p-4">
   <!-- Product 1 -->
   <div class="bg-white border border-gray-200 rounded-lg p-4">
    <img alt="Floral Polyester Round Neck Womens Mini Dress" class="w-full h-auto rounded-md" height="400" src="https://i.pinimg.com/736x/be/ce/1f/bece1f4feb23f7384bdf6dd3a17b947c.jpg" width="300"/>
    <h2 class="mt-4 text-gray-800 font-semibold">
     Palazzo wide Leg jeans
    </h2>
    <div class="flex items-center space-x-2 mt-2">
     <span class="text-gray-800 font-semibold">
      ₹1499
     </span>
     <span class="line-through text-gray-500">
      ₹2999
     </span>
     <span class="text-red-600">
      50% OFF
     </span>
    </div>
   </div>
   <!-- Product 2 -->
   <div class="bg-white border border-gray-200 rounded-lg p-4">
    <img alt="Floral V-Neck Cotton Womens Knee Length Dress" class="w-300 h-400 rounded-md" height="400" src="https://i.pinimg.com/736x/cb/fd/49/cbfd49816f71ebe7364ae0243c928cb6.jpg" width="300"/>
    <h2 class="mt-4 text-gray-800 font-semibold">
    Cargo Pants
    </h2>
    <div class="flex items-center space-x-2 mt-2">
     <span class="text-gray-800 font-semibold">
      ₹2590
     </span>
    </div>
   </div>
   <!-- Product 3 -->
   <div class="bg-white border border-gray-200 rounded-lg p-4">
    <img alt="Floral Viscose Round Neck Womens Top" class="w-full h-auto rounded-md" height="400" src="https://i.pinimg.com/736x/24/dc/5f/24dc5f2cf0452fb4a8cd9ac6d0bf3b19.jpg" width="300"/>
    <h2 class="mt-4 text-gray-800 font-semibold">
     Boot Cut Jeans
    </h2>
    <div class="flex items-center space-x-2 mt-2">
     <span class="text-gray-800 font-semibold">
      ₹999
     </span>
     <span class="line-through text-gray-500">
      ₹1999
     </span>
     <span class="text-red-600">
      50% OFF
     </span>
    </div>
   </div>
   <!-- Product 4 -->
   <div class="bg-white border border-gray-200 rounded-lg p-4">
    <img alt="Chevron Knee Length Viscose Woven Womens Co-Ord Set" class="w-full h-auto rounded-md" height="400" src="https://i.pinimg.com/736x/b1/24/57/b12457b740cef89b57a3409625b19352.jpg" width="300"/>
    <h2 class="mt-4 text-gray-800 font-semibold">
    Joggers
    </h2>
    <div class="flex items-center space-x-2 mt-2">
     <span class="text-gray-800 font-semibold">
      ₹2890
     </span>
    </div>
   </div>
  </div>
 </body>
</html>
