<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Grid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <style>
        /* Modal styles */
        .modal {
            display: none; /* Hidden by default */
            position: fixed; /* Stay in place */
            z-index: 1000; /* Sit on top */
            left: 0;
            top: 0;
            width: 100%; /* Full width */
            height: 100%; /* Full height */
            overflow: auto; /* Enable scroll if needed */
            background-color: rgb(0,0,0); /* Fallback color */
            background-color: rgba(0,0,0,0.4); /* Black w/ opacity */
        }
        .modal-content {
            background-color: #fefefe;
            margin: 15% auto; /* 15% from the top and centered */
            padding: 20px;
            border: 1px solid #888;
            width: 80%; /* Could be more or less, depending on screen size */
        }
    </style>
</head>
<body class="bg-white">
    <!-- Header -->
    <div class="flex items-center justify-between p-4 bg-gray-100">
        <div class="flex items-center space-x-4">
            <i class="fas fa-search text-gray-500"></i>
            <input class="w-full p-2 text-gray-700 bg-white border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="What are you looking for?" type="text"/>
        </div>
        <div class="flex items-center space-x-4">
            <a class="text-gray-700" href="#">Login</a>
            <i class="fas fa-user text-gray-700"></i>
            <i class="fas fa-heart text-gray-700"></i>
            <i class="fas fa-shopping-cart text-gray-700"></i>
        </div>
    </div>

    <!-- Navigation -->
    <div class="flex justify-center space-x-8 p-4 bg-white border-b border-gray-200">
        <a class="text-gray-700" href="#">WOMEN</a>
        <a class="text-gray-700" href="#">KIDS</a>
        <a class="text-gray-700" href="#">BRANDS</a>
        <a class="text-gray-700" href="#">STYLE HUB</a>
    </div>

    <!-- Product Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 p-4">
        <!-- Product 1 -->
        <div class="bg-white border border-gray-200 rounded-lg p-4 flex flex-col justify-between">
            <img alt="Knee Length Parka" class="w-full h-auto rounded-md" src="https://i.pinimg.com/736x/b3/5e/9d/b35e9ddd952c33781b95e9dffb2e8a7f.jpg"/>
            <h2 class="mt-4 text-gray-800 font-semibold">Knee Length Parka</h2>
            <div class="flex items-center space-x-2 mt-2">
                <span class="text-gray-800 font-semibold">₹1499</span>
                <span class="line-through text-gray-500">₹2999</span>
                <span class="text-red-600">50% OFF</span>
            </div>
            <div class="mt-4">
                <button class="w-full bg-purple-600 text-white py-2 rounded-md hover:bg-purple-700" onclick="openModal('Knee Length Parka', '₹1499', 'This stylish knee-length parka is perfect for keeping warm while looking fashionable. Made from high-quality materials, it features a comfortable fit and a modern design.')">Shop Now</button>
                <button class="w-full bg-black text-white py-2 rounded-md hover:bg-black mt-2">
                    <a href="parka.html">Customize</a>
                </button>
            </div>
        </div>

        <!-- Product  2 -->
        <div class="bg-white border border-gray-200 rounded-lg p-4 flex flex-col justify-between">
            <img alt="A-Line Coat" class="w-full h-auto rounded-md" src="https://i.pinimg.com/736x/ba/75/ee/ba75eefd39fbc9fdbe78ce8464ac3428.jpg"/>
            <h2 class="mt-4 text-gray-800 font-semibold">A-Line Coat</h2>
            <div class="flex items-center space-x-2 mt-2">
                <span class="text-gray-800 font-semibold">₹2590</span>
            </div>
            <div class="mt-4">
                <button class="w-full bg-purple-600 text-white py-2 rounded-md hover:bg-purple-700" onclick="openModal('A-Line Coat', '₹2590', 'This elegant A-Line coat is designed to provide a flattering silhouette while keeping you warm. Perfect for any occasion.')">Shop Now</button>
                <button class="w-full bg-black text-white py-2 rounded-md hover:bg-black mt-2">
                    <a href="alinecoat.html">Customize</a>
                </button>
            </div>
        </div>

        <!-- Product 3 -->
        <div class="bg-white border border-gray-200 rounded-lg p-4 flex flex-col justify-between">
            <img alt="Trench Coat" class="w-full h-50 rounded-md" src="https://i.pinimg.com/736x/54/8c/e6/548ce6cff543623a297d45f56abd1479.jpg"/>
            <h2 class="mt-4 text-gray-800 font-semibold">Trench Coat</h2>
            <div class="flex items-center space-x-2 mt-2">
                <span class="text-gray-800 font-semibold">₹2999</span>
                <span class="line-through text-gray-500">₹3999</span>
                <span class="text-red-600">25% OFF</span>
            </div>
            <div class="mt-4">
                <button class="w-full bg-purple-600 text-white py-2 rounded-md hover:bg-purple-700" onclick="openModal('Trench Coat', '₹2999', 'This classic trench coat is a timeless piece that adds sophistication to any outfit. Made with durable fabric for long-lasting wear.')">Shop Now</button>
                <button class="w-full bg-black text-white py-2 rounded-md hover:bg-black mt-2">
                    <a href="trenchcoat.html">Customize</a>
                </button>
            </div>
        </div>

        <!-- Product 4 -->
        <div class="bg-white border border-gray-200 rounded-lg p-4 flex flex-col justify-between">
            <img alt="Hooded Parka" class="w-full h-auto rounded-md" src="https://i.pinimg.com/474x/9f/d8/09/9fd8099d5ceb0fee83e2083f3d85c00a.jpg"/>
            <h2 class="mt-4 text-gray-800 font-semibold">Hooded Parka</h2>
            <div class="flex items-center space-x-2 mt-2">
                <span class="text-gray-800 font-semibold">₹1999</span>
                <span class="line-through text-gray-500">₹3499</span>
                <span class="text-red-600">43% OFF</span>
            </div>
            <div class="mt-4">
                <button class="w-full bg-purple-600 text-white py-2 rounded-md hover:bg-purple-700" onclick="openModal('Hooded Parka', '₹1999', 'Stay warm and stylish with this hooded parka, featuring a cozy lining and a modern design. Perfect for chilly days.')">Shop Now</button>
                <button class="w-full bg-black text-white py-2 rounded-md hover:bg-black mt-2">
                    <a href="hoodedparka.html">Customize</a>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle" class="text-gray-800 font-semibold"></h2>
            <p id="modalPrice" class="text-gray-800 font-semibold"></p>
            <p id="modalDescription" class="text-gray-600"></p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-100 p-4 text-center">
        <p class="text-gray-700">© 2023 Your Store. All rights reserved.</p>
    </footer>

    <script>
        function openModal(title, price, description) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalPrice').innerText = price;
            document.getElementById('modalDescription').innerText = description;
            document.getElementById('productModal').style.display = "block";
        }

        function closeModal() {
            document.getElementById('productModal').style.display = "none";
        }

        // Close the modal when clicking outside of it
        window.onclick = function(event) {
            if (event.target == document.getElementById('productModal')) {
                closeModal();
            }
        }
    </script>
</body>
</html>
